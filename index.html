<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Паспорт питомца</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F4;
    --card-bg:#FFFFFF;
    --accent:#4A2F26;
    --accent-soft:#F0E8E2;
    --ink:#2A211C;
    --ink-soft:#A99C90;
    --line:#EFE8E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--line);
    font-family:'Inter', -apple-system, system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  h1, .title, .card-value, .pet-name, .doc-name, .tab-btn span{
    font-family:'Outfit', 'Inter', -apple-system, system-ui, sans-serif;
  }

  /* Auth screen */
  .auth-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:32px 28px;
  }
  .title{font-size:26px; font-weight:700; color:var(--accent); margin-bottom:6px;}
  .subtitle{font-size:13px; color:var(--ink-soft); margin-bottom:24px; line-height:1.5;}
  input, select{
    width:100%;
    padding:12px 14px;
    margin-bottom:12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card-bg);
    font-size:14px;
    color:var(--ink);
    font-family:inherit;
  }
  button.primary{
    width:100%;
    padding:13px;
    background:var(--accent);
    color:var(--card-bg);
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .switch-link{
    text-align:center;
    margin-top:16px;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }
  .msg-error{
    background:var(--accent-soft); color:var(--accent);
    padding:10px 12px; border-radius:8px; font-size:12px; margin-bottom:14px;
  }
  .msg-ok{
    background:var(--accent-soft); color:var(--ink);
    padding:10px 12px; border-radius:8px; font-size:12px; margin-bottom:14px;
  }

  /* App header */
  .app-header{
    padding:24px 20px 16px;
    display:flex; justify-content:space-between; align-items:center;
    gap:12px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--accent-soft), var(--bg));
  }
  .app-header h1{font-size:22px; font-weight:700; color:var(--accent); margin:0;}
  .signout{font-size:12px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; flex-shrink:0;}

  .content{padding:8px 20px 24px;}

  /* Shared card component: white tile, soft shadow, no left stripe */
  .card{
    display:flex; align-items:center; gap:14px;
    background:var(--card-bg);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:0 3px 10px -4px rgba(0,0,0,.06);
    cursor:pointer;
  }
  .card-label{font-size:10px; color:var(--ink-soft);}
  .card-value{font-size:14px; font-weight:700; color:var(--ink); margin-top:2px;}

  .avatar{
    width:48px; height:48px; border-radius:50%;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .avatar svg{width:24px; height:24px;}
  .avatar-sm{width:32px; height:32px;}
  .avatar-sm svg{width:18px; height:18px;}

  .pet-info{flex:1; min-width:0;}
  .pet-meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .link-danger{
    font-size:12px; color:var(--accent);
    text-decoration:underline; cursor:pointer; flex-shrink:0;
  }
  .add-btn{
    margin-top:8px; padding:13px;
    border:1px dashed var(--line); border-radius:12px;
    text-align:center; font-size:13px; color:var(--ink-soft);
    cursor:pointer; background:transparent; width:100%;
  }
  .form-card{
    margin-top:16px; padding:16px;
    background:var(--card-bg); border-radius:16px;
    box-shadow:0 3px 10px -4px rgba(0,0,0,.06);
  }
  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 0 20px;}
  .hidden{display:none;}

  .field-label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  /* iOS Safari fix: input[type=date] ignores width:100% and can overflow its card. Global selector — applies to every date field in the app. */
  input[type="date"]{
    -webkit-min-logical-width:100%;
    max-width:100%;
  }

  /* Documents */
  .doc-group{margin-bottom:16px;}
  .doc-group-date{
    font-size:12px; font-weight:600; color:var(--ink-soft);
    margin:0 0 8px;
  }
  .doc-row{cursor:default;}
  .doc-row .doc-info{flex:1; min-width:0;}
  .doc-thumb{
    width:44px; height:44px; border-radius:12px; object-fit:cover;
    background:var(--accent-soft);
    flex-shrink:0;
  }

  /* Bottom tab bar (pet passport screen) */
  #pet-screen .content{padding-bottom:96px;}
  .tab-panel.hidden{display:none;}
  .tab-bar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:420px;
    display:flex;
    background:var(--card-bg);
    border-top:1px solid var(--line);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -3px 10px -4px rgba(0,0,0,.06);
    z-index:10;
  }
  .tab-btn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; padding:6px 2px;
    cursor:pointer; color:var(--ink-soft);
  }
  .tab-btn svg{width:22px; height:22px; stroke:currentColor;}
  .tab-btn span{font-size:10px; font-weight:600;}
  .tab-btn.active{color:var(--accent);}
  .tab-btn:disabled{opacity:.4; cursor:default;}
</style>
</head>
<body>
<div id="app">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="auth-screen">
    <div class="title">Паспорт питомца</div>
    <div class="subtitle" id="auth-subtitle">Войди, чтобы увидеть своих питомцев.</div>
    <div id="auth-msg"></div>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="Почта" required>
      <input type="password" id="auth-password" placeholder="Пароль" required minlength="6">
      <button class="primary" type="submit" id="auth-submit">Войти</button>
    </form>
    <div class="switch-link" id="auth-switch">Ещё нет аккаунта? Зарегистрироваться</div>
  </div>

  <!-- APP SCREEN -->
  <div id="app-screen" class="hidden">
    <div class="app-header">
      <h1>Мои питомцы</h1>
      <div class="signout" id="signout-btn">Выйти</div>
    </div>
    <div class="content">
      <div id="pets-list"></div>
      <div id="empty-msg" class="empty hidden">Питомцев пока нет — добавь первого.</div>
      <button class="add-btn" id="show-add-btn">Добавить питомца</button>

      <div class="form-card hidden" id="add-form-card">
        <div id="add-msg"></div>
        <form id="add-pet-form">
          <input type="text" id="pet-name" placeholder="Имя" required>
          <select id="pet-species">
            <option value="cat">Кошка</option>
            <option value="dog">Собака</option>
          </select>
          <select id="pet-breed"></select>
          <label class="field-label" for="pet-birth">Дата рождения</label>
          <input type="date" id="pet-birth">
          <label class="field-label" for="pet-sex">Пол</label>
          <select id="pet-sex">
            <option value="">Не указан</option>
            <option value="male">Мальчик</option>
            <option value="female">Девочка</option>
          </select>
          <label class="field-label" for="pet-neutered">Стерилизация</label>
          <select id="pet-neutered">
            <option value="">Не указано</option>
            <option value="false">Не стерилизован(а)</option>
            <option value="true">Стерилизован(а)</option>
          </select>
          <button class="primary" type="submit">Сохранить</button>
          <div class="switch-link" id="cancel-add-btn" style="margin-top:12px;">Отмена</div>
        </form>
      </div>
    </div>
  </div>

  <!-- PET PASSPORT SCREEN -->
  <div id="pet-screen" class="hidden">
    <div class="app-header">
      <div class="switch-link" id="back-btn" style="margin:0;">← Назад</div>
      <div style="display:flex; align-items:center; gap:8px; min-width:0;">
        <div class="avatar avatar-sm" id="detail-avatar"></div>
        <h1 id="detail-title" style="font-size:16px;">Паспорт</h1>
      </div>
      <div class="link-danger" id="delete-pet-btn">Удалить</div>
    </div>
    <div class="content">

      <!-- TAB: PASSPORT -->
      <div id="tab-passport" class="tab-panel">
        <div id="pet-detail-msg"></div>
        <form id="pet-detail-form">
          <input type="text" id="detail-name" placeholder="Имя" required>

          <select id="detail-species">
            <option value="cat">Кошка</option>
            <option value="dog">Собака</option>
          </select>

          <select id="detail-breed"></select>

          <label class="field-label" for="detail-birth">Дата рождения</label>
          <input type="date" id="detail-birth">
          <div class="pet-meta" id="detail-age" style="margin:-4px 0 12px;"></div>

          <label class="field-label" for="detail-sex">Пол</label>
          <select id="detail-sex">
            <option value="">Не указан</option>
            <option value="male">Мальчик</option>
            <option value="female">Девочка</option>
          </select>

          <label class="field-label" for="detail-neutered">Стерилизация</label>
          <select id="detail-neutered">
            <option value="">Не указано</option>
            <option value="false">Не стерилизован(а)</option>
            <option value="true">Стерилизован(а)</option>
          </select>

          <button class="primary" type="submit">Сохранить</button>
        </form>
      </div>

      <!-- TAB: DOCUMENTS -->
      <div id="tab-documents" class="tab-panel hidden">
        <div id="docs-list"></div>
        <div id="docs-empty" class="empty hidden">Пока нет документов</div>
        <button type="button" class="add-btn" id="show-add-doc-btn">Добавить документ</button>

        <div class="form-card hidden" id="add-doc-card">
          <div id="add-doc-msg"></div>
          <form id="add-doc-form">
            <label class="field-label" for="doc-photo">Фото документа</label>
            <input type="file" id="doc-photo" accept="image/*" required>
            <input type="text" id="doc-title" placeholder="Название, например «Анализ крови»" required>
            <label class="field-label" for="doc-date">Дата</label>
            <input type="date" id="doc-date">
            <button class="primary" type="submit" id="add-doc-submit">Сохранить</button>
            <div class="switch-link" id="cancel-add-doc-btn" style="margin-top:12px;">Отмена</div>
          </form>
        </div>
      </div>

      <!-- TAB: VACCINES (stub) -->
      <div id="tab-vaccines" class="tab-panel hidden">
        <div class="empty">Раздел «Прививки» скоро появится</div>
      </div>

      <!-- TAB: MEDICATIONS (stub) -->
      <div id="tab-meds" class="tab-panel hidden">
        <div class="empty">Раздел «Лекарства» скоро появится</div>
      </div>

    </div>

    <!-- BOTTOM TAB BAR -->
    <nav class="tab-bar">
      <button type="button" class="tab-btn active" data-tab="passport">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10h2"/><path d="M16 14h2"/><path d="M6.17 15a3 3 0 0 1 5.66 0"/><circle cx="9" cy="11" r="2"/><rect x="2" y="5" width="20" height="14" rx="2"/></svg>
        <span>Паспорт</span>
      </button>
      <button type="button" class="tab-btn" data-tab="documents">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        <span>Документы</span>
      </button>
      <button type="button" class="tab-btn" data-tab="vaccines" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></svg>
        <span>Прививки</span>
      </button>
      <button type="button" class="tab-btn" data-tab="meds" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
        <span>Лекарства</span>
      </button>
    </nav>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://wktylbnggdfepixtkrnn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_WhkqHDpNcoazgPK9U7lqdg_AaLHvFya";

  let accessToken = null;
  let mode = "signin";

  const SPECIES_ICON = {
    cat: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z"/><path d="M8 14v.5"/><path d="M16 14v.5"/><path d="M11.25 16.25h1.5L12 17l-.75-.75Z"/></svg>`,
    dog: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/></svg>`
  };
  function speciesIcon(species){
    return SPECIES_ICON[species === "dog" ? "dog" : "cat"];
  }

  const BREEDS_BY_SPECIES = {
    cat: [
      "Метис / не знаю породу",
      "Абиссинская",
      "Американский керл",
      "Балийская",
      "Бенгальская",
      "Бирманская",
      "Бомбейская",
      "Британская длинношёрстная",
      "Британская короткошёрстная",
      "Бурманская",
      "Бурмилла",
      "Гавана браун",
      "Девон-рекс",
      "Донской сфинкс",
      "Египетская мау",
      "Карельский бобтейл",
      "Корат",
      "Корниш-рекс",
      "Курильский бобтейл",
      "Лаперм",
      "Манчкин",
      "Мейн-кун",
      "Мэнкс",
      "Невская маскарадная",
      "Норвежская лесная",
      "Ориентальная",
      "Оцикет",
      "Персидская",
      "Петерболд",
      "Пикси-боб",
      "Русская голубая",
      "Рэгдолл",
      "Селкирк-рекс",
      "Сиамская",
      "Сибирская",
      "Сингапура",
      "Сомали",
      "Сфинкс",
      "Тайская",
      "Тонкинская",
      "Турецкая ангора",
      "Турецкий ван",
      "Хайленд-фолд",
      "Чаузи",
      "Шотландская вислоухая",
      "Шотландская прямоухая",
      "Экзотическая короткошёрстная",
      "Японский бобтейл",
      "Другая"
    ],
    dog: [
      "Дворняга / не знаю породу",
      "Лабрадор-ретривер",
      "Золотистый ретривер",
      "Немецкая овчарка",
      "Хаски",
      "Джек-рассел-терьер",
      "Йоркширский терьер",
      "Чихуахуа",
      "Такса",
      "Шпиц",
      "Бигль",
      "Мопс",
      "Французский бульдог",
      "Той-терьер",
      "Кавказская овчарка",
      "Среднеазиатская овчарка",
      "Ротвейлер",
      "Доберман",
      "Пудель",
      "Другая"
    ]
  };

  function renderBreedOptions(species, selectId){
    const breedSelect = document.getElementById(selectId || "pet-breed");
    const breeds = BREEDS_BY_SPECIES[species] || BREEDS_BY_SPECIES.cat;
    breedSelect.innerHTML = breeds.map(b => `<option value="${b}">${b}</option>`).join("");
  }

  function setSelectValueSafe(select, value){
    if(value === null || value === undefined || value === ""){
      select.selectedIndex = 0;
      return;
    }
    const exists = Array.from(select.options).some(o => o.value === value);
    if(!exists){
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = value;
      select.insertBefore(opt, select.firstChild);
    }
    select.value = value;
  }

  document.getElementById("pet-species").addEventListener("change", (e) => {
    renderBreedOptions(e.target.value, "pet-breed");
  });
  renderBreedOptions(document.getElementById("pet-species").value, "pet-breed");

  function calcAge(birthDate){
    if(!birthDate) return "";
    const b = new Date(birthDate);
    const now = new Date();
    let years = now.getFullYear() - b.getFullYear();
    let months = now.getMonth() - b.getMonth();
    if(now.getDate() < b.getDate()) months -= 1;
    if(months < 0){ years -= 1; months += 12; }
    return years > 0 ? `${years} г. ${months} мес.` : `${months} мес.`;
  }

  const authForm = document.getElementById("auth-form");
  const authMsg = document.getElementById("auth-msg");
  const authSubmit = document.getElementById("auth-submit");
  const authSubtitle = document.getElementById("auth-subtitle");
  const authSwitch = document.getElementById("auth-switch");

  authSwitch.addEventListener("click", () => {
    mode = mode === "signin" ? "signup" : "signin";
    authSubmit.textContent = mode === "signin" ? "Войти" : "Зарегистрироваться";
    authSubtitle.textContent = mode === "signin"
      ? "Войди, чтобы увидеть своих питомцев."
      : "Создай аккаунт — это займёт минуту.";
    authSwitch.textContent = mode === "signin"
      ? "Ещё нет аккаунта? Зарегистрироваться"
      : "Уже есть аккаунт? Войти";
    authMsg.innerHTML = "";
  });

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    authMsg.innerHTML = "";
    authSubmit.disabled = true;
    authSubmit.textContent = "Секунду...";

    const email = document.getElementById("auth-email").value;
    const password = document.getElementById("auth-password").value;
    const endpoint = mode === "signup"
      ? `${SUPABASE_URL}/auth/v1/signup`
      : `${SUPABASE_URL}/auth/v1/token?grant_type=password`;

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if(!res.ok){
        authMsg.innerHTML = `<div class="msg-error">${data.error_description || data.msg || data.error || "Что-то пошло не так"}</div>`;
      } else if(mode === "signup" && !data.access_token){
        authMsg.innerHTML = `<div class="msg-ok">Готово! Проверь почту и подтверди адрес, потом войди через «Вход».</div>`;
        mode = "signin";
        authSubmit.textContent = "Войти";
        authSwitch.textContent = "Ещё нет аккаунта? Зарегистрироваться";
      } else if(data.access_token){
        accessToken = data.access_token;
        showApp();
        loadPets();
      }
    } catch(err){
      authMsg.innerHTML = `<div class="msg-error">Не получилось связаться с сервером. Проверь соединение.</div>`;
    }
    authSubmit.disabled = false;
    if(mode === "signin") authSubmit.textContent = "Войти"; else authSubmit.textContent = "Зарегистрироваться";
  });

  function showApp(){
    document.getElementById("auth-screen").classList.add("hidden");
    document.getElementById("app-screen").classList.remove("hidden");
  }

  document.getElementById("signout-btn").addEventListener("click", () => {
    accessToken = null;
    document.getElementById("app-screen").classList.add("hidden");
    document.getElementById("auth-screen").classList.remove("hidden");
    document.getElementById("auth-email").value = "";
    document.getElementById("auth-password").value = "";
  });

  async function loadPets(){
    const list = document.getElementById("pets-list");
    const emptyMsg = document.getElementById("empty-msg");
    list.innerHTML = "";
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pets?select=*&order=created_at.asc`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}` }
      });
      const pets = await res.json();
      if(!Array.isArray(pets) || pets.length === 0){
        emptyMsg.classList.remove("hidden");
        return;
      }
      emptyMsg.classList.add("hidden");
      pets.forEach(pet => {
        const row = document.createElement("div");
        row.className = "card pet-row";
        const speciesLabel = pet.species === "cat" ? "Кошка" : "Собака";
        const age = pet.birth_date ? ` · ${calcAge(pet.birth_date)}` : "";
        row.innerHTML = `
          <div class="avatar">${speciesIcon(pet.species)}</div>
          <div class="pet-info">
            <div class="card-label">${speciesLabel}${age}</div>
            <div class="card-value pet-name">${pet.name}</div>
          </div>
          <div class="link-danger pet-delete-btn">Удалить</div>`;
        row.addEventListener("click", () => openPetDetail(pet));
        row.querySelector(".pet-delete-btn").addEventListener("click", async (ev) => {
          ev.stopPropagation();
          const ok = await deletePet(pet.id);
          if(ok) loadPets();
        });
        list.appendChild(row);
      });
    } catch(err){
      list.innerHTML = "";
    }
  }

  document.getElementById("show-add-btn").addEventListener("click", () => {
    document.getElementById("add-form-card").classList.remove("hidden");
    document.getElementById("show-add-btn").classList.add("hidden");
  });
  document.getElementById("cancel-add-btn").addEventListener("click", () => {
    document.getElementById("add-form-card").classList.add("hidden");
    document.getElementById("show-add-btn").classList.remove("hidden");
  });

  document.getElementById("add-pet-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const addMsg = document.getElementById("add-msg");
    addMsg.innerHTML = "";
    const name = document.getElementById("pet-name").value;
    const species = document.getElementById("pet-species").value;
    const breed = document.getElementById("pet-breed").value || null;
    const birth_date = document.getElementById("pet-birth").value || null;
    const sexVal = document.getElementById("pet-sex").value;
    const sex = sexVal || null;
    const neuteredVal = document.getElementById("pet-neutered").value;
    const neutered = neuteredVal === "" ? null : neuteredVal === "true";

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pets`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: JSON.stringify({ name, species, breed, birth_date, sex, neutered })
      });
      const data = await res.json();
      if(!res.ok){
        addMsg.innerHTML = `<div class="msg-error">${data.message || "Не удалось сохранить питомца"}</div>`;
        return;
      }
      document.getElementById("add-pet-form").reset();
      renderBreedOptions(document.getElementById("pet-species").value, "pet-breed");
      document.getElementById("add-form-card").classList.add("hidden");
      document.getElementById("show-add-btn").classList.remove("hidden");
      loadPets();
    } catch(err){
      addMsg.innerHTML = `<div class="msg-error">Не получилось связаться с сервером</div>`;
    }
  });

  /* ---------- Pet passport screen ---------- */

  let currentPetId = null;

  async function deletePet(id){
    if(!confirm("Удалить питомца? Это действие нельзя отменить.")) return false;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pets?id=eq.${id}`, {
        method: "DELETE",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}` }
      });
      if(!res.ok){
        alert("Не удалось удалить питомца");
        return false;
      }
      return true;
    } catch(err){
      alert("Не получилось связаться с сервером");
      return false;
    }
  }

  function updateDetailAge(){
    const birth = document.getElementById("detail-birth").value;
    document.getElementById("detail-age").textContent = birth ? `Возраст: ${calcAge(birth)}` : "";
  }

  function openPetDetail(pet){
    currentPetId = pet.id;
    document.getElementById("pet-detail-msg").innerHTML = "";
    document.getElementById("detail-title").textContent = pet.name || "Паспорт";
    document.getElementById("detail-avatar").innerHTML = speciesIcon(pet.species);
    switchTab("passport");
    document.getElementById("detail-name").value = pet.name || "";
    document.getElementById("detail-species").value = pet.species === "dog" ? "dog" : "cat";
    renderBreedOptions(document.getElementById("detail-species").value, "detail-breed");
    setSelectValueSafe(document.getElementById("detail-breed"), pet.breed);
    document.getElementById("detail-birth").value = pet.birth_date || "";
    updateDetailAge();
    document.getElementById("detail-sex").value = pet.sex === "male" || pet.sex === "female" ? pet.sex : "";
    document.getElementById("detail-neutered").value =
      pet.neutered === true ? "true" : pet.neutered === false ? "false" : "";

    document.getElementById("add-doc-msg").innerHTML = "";
    document.getElementById("add-doc-form").reset();
    document.getElementById("add-doc-card").classList.add("hidden");
    document.getElementById("show-add-doc-btn").classList.remove("hidden");
    loadDocuments(pet.id);

    document.getElementById("app-screen").classList.add("hidden");
    document.getElementById("pet-screen").classList.remove("hidden");
  }

  function closePetDetail(){
    document.getElementById("pet-screen").classList.add("hidden");
    document.getElementById("app-screen").classList.remove("hidden");
  }

  function switchTab(tab){
    document.querySelectorAll(".tab-panel").forEach(el => el.classList.add("hidden"));
    document.getElementById(`tab-${tab}`).classList.remove("hidden");
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === tab);
    });
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    if(btn.disabled) return;
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });

  document.getElementById("back-btn").addEventListener("click", closePetDetail);

  document.getElementById("detail-species").addEventListener("change", (e) => {
    renderBreedOptions(e.target.value, "detail-breed");
  });

  document.getElementById("detail-birth").addEventListener("change", updateDetailAge);

  document.getElementById("delete-pet-btn").addEventListener("click", async () => {
    const ok = await deletePet(currentPetId);
    if(ok){
      closePetDetail();
      loadPets();
    }
  });

  document.getElementById("pet-detail-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("pet-detail-msg");
    msg.innerHTML = "";
    const name = document.getElementById("detail-name").value;
    const species = document.getElementById("detail-species").value;
    const breed = document.getElementById("detail-breed").value || null;
    const birth_date = document.getElementById("detail-birth").value || null;
    const sexVal = document.getElementById("detail-sex").value;
    const sex = sexVal || null;
    const neuteredVal = document.getElementById("detail-neutered").value;
    const neutered = neuteredVal === "" ? null : neuteredVal === "true";

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pets?id=eq.${currentPetId}`, {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: JSON.stringify({ name, species, breed, birth_date, sex, neutered })
      });
      const data = await res.json();
      if(!res.ok){
        msg.innerHTML = `<div class="msg-error">${data.message || "Не удалось сохранить изменения"}</div>`;
        return;
      }
      document.getElementById("detail-title").textContent = name || "Паспорт";
      msg.innerHTML = `<div class="msg-ok">Сохранено</div>`;
      loadPets();
    } catch(err){
      msg.innerHTML = `<div class="msg-error">Не получилось связаться с сервером</div>`;
    }
  });

  /* ---------- Documents ---------- */

  const DOCS_BUCKET = "pet-documents";

  function compressImage(file, maxSize, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error("Не удалось прочитать изображение"));
        img.onload = () => {
          let { width, height } = img;
          if(width > height && width > maxSize){
            height = Math.round(height * (maxSize / width));
            width = maxSize;
          } else if(height >= width && height > maxSize){
            width = Math.round(width * (maxSize / height));
            height = maxSize;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => {
            if(blob) resolve(blob); else reject(new Error("Не удалось сжать изображение"));
          }, "image/jpeg", quality);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function randomId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  function formatDocDate(dateStr){
    const d = new Date(`${dateStr}T00:00:00`);
    if(isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "long", year: "numeric" });
  }

  async function getSignedDocUrl(path){
    try {
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${DOCS_BUCKET}/${path}`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ expiresIn: 3600 })
      });
      if(!res.ok) return null;
      const data = await res.json();
      return data.signedURL ? `${SUPABASE_URL}/storage/v1${data.signedURL}` : null;
    } catch(err){
      return null;
    }
  }

  async function deleteDocument(doc){
    if(!confirm("Удалить документ? Это действие нельзя отменить.")) return false;
    try {
      const delRes = await fetch(`${SUPABASE_URL}/rest/v1/documents?id=eq.${doc.id}`, {
        method: "DELETE",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}` }
      });
      if(!delRes.ok){
        alert("Не удалось удалить документ");
        return false;
      }
      await fetch(`${SUPABASE_URL}/storage/v1/object/${DOCS_BUCKET}/${doc.file_url}`, {
        method: "DELETE",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}` }
      }).catch(() => {});
      return true;
    } catch(err){
      alert("Не получилось связаться с сервером");
      return false;
    }
  }

  async function loadDocuments(petId){
    const list = document.getElementById("docs-list");
    const emptyMsg = document.getElementById("docs-empty");
    list.innerHTML = "";
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/documents?pet_id=eq.${petId}&select=*&order=document_date.desc,created_at.desc`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}` } }
      );
      const docs = await res.json();
      if(!Array.isArray(docs) || docs.length === 0){
        emptyMsg.classList.remove("hidden");
        return;
      }
      emptyMsg.classList.add("hidden");

      const groups = new Map();
      docs.forEach(doc => {
        const key = doc.document_date || "";
        if(!groups.has(key)) groups.set(key, []);
        groups.get(key).push(doc);
      });

      groups.forEach((docsInGroup, dateKey) => {
        const groupEl = document.createElement("div");
        groupEl.className = "doc-group";
        const dateLabel = dateKey ? formatDocDate(dateKey) : "Без даты";
        groupEl.innerHTML = `<div class="doc-group-date">${dateLabel}</div>`;

        docsInGroup.forEach(doc => {
          const row = document.createElement("div");
          row.className = "card doc-row";
          row.innerHTML = `
            <img class="doc-thumb" alt="">
            <div class="doc-info">
              <div class="card-value doc-name">${doc.title || "Документ"}</div>
            </div>
            <div class="link-danger doc-delete-btn">Удалить</div>`;

          const img = row.querySelector(".doc-thumb");
          getSignedDocUrl(doc.file_url).then(url => { if(url) img.src = url; });
          img.addEventListener("click", async () => {
            const url = await getSignedDocUrl(doc.file_url);
            if(url) window.open(url, "_blank");
          });

          row.querySelector(".doc-delete-btn").addEventListener("click", async () => {
            const ok = await deleteDocument(doc);
            if(ok) loadDocuments(petId);
          });

          groupEl.appendChild(row);
        });

        list.appendChild(groupEl);
      });
    } catch(err){
      list.innerHTML = "";
    }
  }

  document.getElementById("show-add-doc-btn").addEventListener("click", () => {
    document.getElementById("add-doc-msg").innerHTML = "";
    document.getElementById("doc-date").value = new Date().toISOString().slice(0, 10);
    document.getElementById("add-doc-card").classList.remove("hidden");
    document.getElementById("show-add-doc-btn").classList.add("hidden");
  });
  document.getElementById("cancel-add-doc-btn").addEventListener("click", () => {
    document.getElementById("add-doc-form").reset();
    document.getElementById("add-doc-card").classList.add("hidden");
    document.getElementById("show-add-doc-btn").classList.remove("hidden");
  });

  document.getElementById("add-doc-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("add-doc-msg");
    msg.innerHTML = "";

    const fileInput = document.getElementById("doc-photo");
    const file = fileInput.files[0];
    const title = document.getElementById("doc-title").value;
    const document_date = document.getElementById("doc-date").value || new Date().toISOString().slice(0, 10);

    if(!file){
      msg.innerHTML = `<div class="msg-error">Выбери фото документа</div>`;
      return;
    }

    const submitBtn = document.getElementById("add-doc-submit");
    submitBtn.disabled = true;
    submitBtn.textContent = "Загрузка...";

    let uploadPath = null;
    try {
      const blob = await compressImage(file, 1600, 0.8);
      uploadPath = `${currentPetId}/${randomId()}.jpg`;

      const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/${DOCS_BUCKET}/${uploadPath}`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "image/jpeg"
        },
        body: blob
      });
      if(!uploadRes.ok){
        throw new Error("upload_failed");
      }

      const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/documents`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: JSON.stringify({ pet_id: currentPetId, title, document_date, file_url: uploadPath })
      });
      if(!insertRes.ok){
        // Загрузка файла прошла, а запись создать не удалось — удаляем файл,
        // чтобы в хранилище не оставался "осиротевший" объект без записи в БД.
        await fetch(`${SUPABASE_URL}/storage/v1/object/${DOCS_BUCKET}/${uploadPath}`, {
          method: "DELETE",
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}` }
        }).catch(() => {});
        throw new Error("insert_failed");
      }

      document.getElementById("add-doc-form").reset();
      document.getElementById("add-doc-card").classList.add("hidden");
      document.getElementById("show-add-doc-btn").classList.remove("hidden");
      loadDocuments(currentPetId);
    } catch(err){
      msg.innerHTML = `<div class="msg-error">Не удалось загрузить документ. Проверь соединение и попробуй ещё раз.</div>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Сохранить";
    }
  });
</script>
